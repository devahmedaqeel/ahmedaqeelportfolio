  <text x="256" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif" font-size="280" font-weight="900" text-anchor="middle" fill="url(#cyberGrad)" filter="url(#glow)">{}</text>
